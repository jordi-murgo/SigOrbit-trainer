[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "sigorbit-trainer"
version = "0.2.2"
description = "Offline, auditable training workflows for SigOrbit signature encoders"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordi Murgó", email = "jordi.murgo@gmail.com" }]
maintainers = [{ name = "Jordi Murgó", email = "jordi.murgo@gft.com" }]
keywords = ["signature", "biometrics", "rotation-invariance", "training", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=12.3,<13",
  "pydantic>=2.12,<3",
  "safetensors>=0.7,<1",
  "sigorbit>=0.1.0",
  "torch>=2.7",
  "torchvision>=0.22",
  "tomli>=2.4,<3; python_version < '3.11'",
]

[project.optional-dependencies]
hf = ["datasets>=4,<6"]
dev = [
  "bandit[toml]>=1.9.4,<2",
  "build>=1.3,<2",
  "mypy>=2.3.0,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
  "twine>=7.0.0,<8",
]

[project.scripts]
sigorbit-train = "sigorbit_trainer.cli:main"

[project.urls]
Homepage = "https://github.com/jordi-murgo/sigorbit-trainer"
Repository = "https://github.com/jordi-murgo/sigorbit-trainer"
Issues = "https://github.com/jordi-murgo/sigorbit-trainer/issues"
Documentation = "https://github.com/jordi-murgo/sigorbit-trainer/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/sigorbit_trainer"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/docs",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CITATION.cff",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = ["*.pt", "*.pth", "*.ckpt", "*.safetensors", "*.onnx", "*.db", "*.sqlite"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["slow: tests against the full 257px model"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S101", "S311", "E501", "PTH101", "PTH105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["sigorbit_trainer"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311"]
