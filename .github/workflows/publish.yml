name: Publish to PyPI

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build code-only distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify release tag matches package version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
      - name: Build and validate distributions
        run: |
          uv sync --extra dev --locked
          uv run python -m build
          uv run twine check dist/*
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          if unzip -l dist/*.whl | grep -E '\.(pt|pth|onnx|db|sqlite|sqlite3)( |$)'; then
            echo "Prohibited artifact found in wheel" >&2
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -E '\.(pt|pth|onnx|db|sqlite|sqlite3)$|/(data|checkpoints)/'; then
            echo "Prohibited artifact found in source distribution" >&2
            exit 1
          fi
          sha256sum dist/*
      - name: Upload distributions for the isolated publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sigorbit-trainer
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true